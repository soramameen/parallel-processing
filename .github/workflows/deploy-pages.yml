name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'artifacts/**'
      - 'lessons/**'
      - 'assets/**'
      - 'docs/slides/**'
      - 'docs/artifacts/**'
      - 'reference/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          # 新しい研究ダッシュボードをルートに配置
          cp index.html _site/index.html
          # 既存のartifactsをそのまま配置（bron-kerbosch.htmlも含む）
          cp -r artifacts/. _site/
          mkdir -p _site/lessons _site/assets _site/docs/slides _site/docs/artifacts _site/docs/figures _site/reference
          cp -r lessons/. _site/lessons/
          cp -r assets/. _site/assets/
          cp -r docs/slides/. _site/docs/slides/
          cp -r docs/artifacts/. _site/docs/artifacts/
          cp -r docs/figures/. _site/docs/figures/
          cp -r reference/. _site/reference/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
